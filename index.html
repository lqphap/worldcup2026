<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FBref World Cup Data Proxy</title>
    <style>
        table { border-collapse: collapse; width: 100%; font-family: Arial, sans-serif; font-size: 13px; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
        th { background-color: #f4f4f4; font-weight: bold; }
        .stats_table { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="status">Fetching live tables from FBref...</div>
    <div id="table-container"></div>

    <script>
        async function fetchFBref() {
            const targetUrl = 'https://fbref.com/en/comps/1/World-Cup-Stats';
            // Switching to a more reliable, high-performance CORS proxy
            const proxyUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Proxy server error or rate limited');
                
                const htmlText = await response.text();
                
                // Parse the text string into clean HTML nodes
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // Find all tables on the page with FBref's statistical layout class
                const fbrefTables = doc.querySelectorAll('table.stats_table');

                if (fbrefTables.length > 0) {
                    const container = document.getElementById('table-container');
                    container.innerHTML = ''; // Wipe out previous errors

                    // Grab the first 3 primary data tables (Group stage standings, stats, etc.)
                    // and append them sequentially so Google Sheets can pick its preferred index.
                    for (let i = 0; i < Math.min(fbrefTables.length, 3); i++) {
                        let currentTable = fbrefTables[i];
                        
                        // Clean up hyperlinked text so Google Sheets reads raw strings
                        currentTable.querySelectorAll('a').forEach(a => a.replaceWith(a.textContent));
                        
                        container.appendChild(currentTable);
                    }
                    
                    document.getElementById('status').innerHTML = "Data Successfully Synced: " + new Date().toLocaleTimeString();
                } else {
                    document.getElementById('status').innerText = "Target tables not found on the page structure.";
                }
            } catch (error) {
                document.getElementById('status').innerText = "Sync Failed: " + error.message + ". Retrying shortly...";
            }
        }

        fetchFBref();
    </script>
</body>
</html>
