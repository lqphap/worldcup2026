<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenFootball World Cup 2026 Table</title>
    <style>
        table { border-collapse: collapse; width: 100%; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
    </style>
</head>
<body>
    <table id="match-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Team 1</th>
                <th>Team 2</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr>
                <td colspan="4">Loading data...</td>
            </tr>
        </tbody>
    </table>

    <script>
        async function fetchWorldCupHTML() {
            const jsonUrl = 'https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json';
            try {
                const response = await fetch(jsonUrl);
                const data = await response.json();
                const tbody = document.getElementById('table-body');
                let htmlRows = '';

                if (data.matches && data.matches.length > 0) {
                    data.matches.forEach(match => {
                        htmlRows += `<tr>
                            <td>${match.date || ''}</td>
                            <td>${match.time || ''}</td>
                            <td>${match.team1 || 'TBD'}</td>
                            <td>${match.team2 || 'TBD'}</td>
                        </tr>`;
                    });
                    tbody.innerHTML = htmlRows;
                }
            } catch (error) {
                document.getElementById('table-body').innerHTML = '<tr><td colspan="4">Error loading data</td></tr>';
            }
        }
        fetchWorldCupHTML();
    </script>
</body>
</html>
