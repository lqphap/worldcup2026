<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FBref World Cup Data Proxy</title>
    <style>
        table { border-collapse: collapse; width: 100%; font-family: sans-serif; font-size: 12px; }
        th, td { border: 1px solid #ccc; padding: 5px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <div id="status">Fetching data from FBref...</div>
    <div id="table-container"></div>

    <script>
        async function fetchFBref() {
            // We use a CORS proxy to bypass FBref's block
            const targetUrl = 'https://fbref.com/en/comps/1/World-Cup-Stats';
            const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // Use DOMParser to read the FBref HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                
                // Identify the specific table (usually 'results12345_overall' for group stage)
                // We look for the first table with class 'stats_table'
                const fbrefTable = doc.querySelector('.stats_table');

                if (fbrefTable) {
                    // Clean up links and formatting to make it "Sheet-friendly"
                    fbrefTable.querySelectorAll('a').forEach(a => a.replaceWith(a.textContent));
                    
                    document.getElementById('table-container').appendChild(fbrefTable);
                    document.getElementById('status').innerHTML = "Data Updated: " + new Date().toLocaleTimeString();
                } else {
                    document.getElementById('status').innerText = "Could not find the table on FBref.";
                }
            } catch (error) {
                document.getElementById('status').innerText = "Error: " + error.message;
            }
        }

        fetchFBref();
    </script>
</body>
</html>
