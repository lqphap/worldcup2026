<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenFootball CSV Export</title>
</head>
<body><pre id="csv-output">Loading data...</pre><script>
    async function fetchWorldCupCSV() {
        const jsonUrl = 'https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json';
        try {
            const response = await fetch(jsonUrl);
            if (!response.ok) throw new Error('Fetch failed');
            const data = await response.json();
            
            // CSV Headers mapping your exact requested parameters
            let csvContent = "Date,Time,Team 1,Team 2\n";

            // OpenFootball maps matches in a root array for this file
            if (data.matches && data.matches.length > 0) {
                data.matches.forEach(match => {
                    const matchDate = match.date || '';
                    const matchTime = match.time || '';
                    const team1 = `"${(match.team1 || 'TBD').replace(/"/g, '""')}"`;
                    const team2 = `"${(match.team2 || 'TBD').replace(/"/g, '""')}"`;

                    csvContent += `${matchDate},${matchTime},${team1},${team2}\n`;
                });
                
                document.getElementById('csv-output').textContent = csvContent.trim();
            } else {
                document.getElementById('csv-output').textContent = "Error,No matches found in JSON structure";
            }
        } catch (error) {
            document.getElementById('csv-output').textContent = "Error,Failed to process raw data source";
        }
    }
    fetchWorldCupCSV();
</script></body>
</html>
