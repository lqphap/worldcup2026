<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wikipedia 2026 World Cup Scraper</title>
    <style>
        table { border-collapse: collapse; width: 100%; font-family: sans-serif; font-size: 14px; }
        th, td { border: 1px solid #aaa; padding: 8px; text-align: center; }
        th { background-color: #eaecf0; font-weight: bold; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        .caption { font-weight: bold; font-size: 1.2em; margin-bottom: 10px; font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="caption">2026 FIFA World Cup: Ranking of third-placed teams</div>
    <div id="table-output">Loading live data from Wikipedia...</div>

    <script>
        async function getWikiData() {
            const url = 'https://en.wikipedia.org/w/api.php?action=parse&page=2026_FIFA_World_Cup&format=json&origin=*';
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                const htmlContent = data.parse.text['*'];
                
                // Create a temporary element to parse the HTML string
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                
                // Wikipedia marks this specific table with a specific style/class
                // We search for the table that follows the "Ranking of third-placed teams" ID
                const sectionSpan = doc.getElementById('Ranking_of_third-placed_teams');
                const table = sectionSpan.parentElement.nextElementSibling;
                
                // If the next element isn't the table, find the nearest table after that heading
                const targetTable = table.tagName === 'TABLE' ? table : sectionSpan.parentElement.nextAll('table')[0];

                if (targetTable) {
                    // Clean up: Remove Wikipedia's edit links and reference tags [1], [a], etc.
                    targetTable.querySelectorAll('.mw-editsection, .reference').forEach(el => el.remove());
                    // Remove links but keep text
                    targetTable.querySelectorAll('a').forEach(a => a.replaceWith(a.textContent));
                    
                    document.getElementById('table-output').innerHTML = targetTable.outerHTML;
                } else {
                    document.getElementById('table-output').innerText = "Table not found. Wikipedia layout may have changed.";
                }
            } catch (error) {
                document.getElementById('table-output').innerText = "Error fetching data: " + error.message;
            }
        }

        getWikiData();
    </script>
</body>
</html>
