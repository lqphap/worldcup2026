<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenFootball World Cup 2026 Table</title>
    <style>
        table { border-collapse: collapse; width: 100%; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
    </style>
</head>
<body>
    <table id="match-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Team 1</th>
                <th>Team 2</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Data is injected directly via server side simulation -->
        </tbody>
    </table>

    <script>
        // Directly fetch the text stream to guarantee Google Sheets catches the payload 
        fetch('https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json')
            .then(res => res.json())
            .then(data => {
                let htmlRows = '';
                if(data.matches) {
                    data.matches.forEach(match => {
                        htmlRows += `<tr>
                            <td>${match.date || ''}</td>
                            <td>${match.time || ''}</td>
                            <td>${match.team1 || 'TBD'}</td>
                            <td>${match.team2 || 'TBD'}</td>
                        </tr>`;
                    });
                    document.getElementById('table-body').innerHTML = htmlRows;
                }
            });
    </script>
</body>
</html>
