<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live World Cup 2026 Results for Google Sheets</title>
    <style>
        table { border-collapse: collapse; width: 100%; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #dddddd; text-align: left; padding: 8px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <table id="wc2026-results">
        <thead>
            <tr>
                <th>Match ID</th>
                <th>Stage</th>
                <th>Home Team</th>
                <th>Score</th>
                <th>Away Team</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Google Sheets will scrape this area -->
            <tr>
                <td>Loading...</td>
                <td>Please wait</td>
                <td>Fetching live</td>
                <td>0 - 0</td>
                <td>scores</td>
                <td>LIVE</td>
            </tr>
        </tbody>
    </table>

    <script>
        async function fetchScores() {
            try {
                // Free public backup engine tracking live international match formats
                const response = await fetch('https://worldcupjson.net/matches');
                const data = await response.json();
                const tbody = document.getElementById('table-body');
                let html = '';

                data.forEach(match => {
                    const homeTeam = match.home_team.name || 'TBD';
                    const awayTeam = match.away_team.name || 'TBD';
                    const homeGoals = match.home_team.goals !== null ? match.home_team.goals : '';
                    const awayGoals = match.away_team.goals !== null ? match.away_team.goals : '';
                    const score = (match.status === 'future') ? 'vs' : `${homeGoals} - ${awayGoals}`;
                    
                    html += `<tr>
                        <td>${match.id}</td>
                        <td>${match.stage_name}</td>
                        <td>${homeTeam}</td>
                        <td>${score}</td>
                        <td>${awayTeam}</td>
                        <td>${match.status.toUpperCase()}</td>
                    </tr>`;
                });

                tbody.innerHTML = html;
            } catch (error) {
                document.getElementById('table-body').innerHTML = '<tr><td colspan="6">Error pulling tournament details.</td></tr>';
            }
        }
        
        // Execute stream generation immediately on execution
        fetchScores();
    </script>
</body>
</html>
